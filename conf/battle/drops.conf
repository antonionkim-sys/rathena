//--------------------------------------------------------------
// rAthena Battle Configuration File
// Originally Translated by Peter Kieser <pfak@telus.net>
// Made in to plainer English by Ancyker
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
//--------------------------------------------------------------

// If an item is dropped, does it go straight into the user's inventory? (Note 1)
item_auto_get: no

// How long does it take for an item to disappear from the floor after it is dropped? (in milliseconds)
flooritem_lifetime: 60000

// Bonus to loot priority for first attacker (Note 2)
// The first player in the damage log of a monster that is alive and on the same map gains a loot priority bonus
// Officially 30% of the total damage to a monster is added to this player's damage when calculating loot priority
// If you set this to 0, then loot priority will be solely calculated based on most damage dealt
// If you set this to 100 (max), then the first player in the damage log will always get first loot priority
// Loot priority determines how early a player can loot an item (see settings below)
first_attack_loot_bonus: 30

// Should MVP go to the player with loot priority? (Note 1)
// Officially MVP goes to the player who has the highest value for [damage dealt]+[damage tanked] on the MVP.
// Enable this if you want MVP to instead go to the player who has first loot priority (legacy athena behavior).
mvp_to_loot_priority: no

// Grace time during which only the player who did the most damage to a monster can get the item (in milliseconds)
item_first_get_time: 3000

// Grace time during which only the first and second player who did the most damage to a monster can get the item (in milliseconds)
// (Takes effect after item_first_get_time elapses)
item_second_get_time: 2000

// Grace time during which only the first, second and third player who did the most damage to a monster can get the item (in milliseconds)
// (Takes effect after the item_second_get_time elapses)
item_third_get_time: 2000

// Grace time during which only the player who did the most damage to a boss can get the item (in milliseconds)
// Also applies to MVP reward items, when the Most Valuable Player can't get the prize item and it drops on the ground
mvp_item_first_get_time: 10000

// Grace time during which only the first and second player who did the most damage to a boss can get the item (in milliseconds)
// Also applies to MVP reward items, when first and second MVP can't get the prize item and it drops on the ground
// (Takes effect after mvp_item_first_get_time elapses)
mvp_item_second_get_time: 10000

// Grace time during which only the first, second and third player who did the most damage to a boss can get the item (in milliseconds)
// Also applies to MVP reward items, when first, second and third MVP can't get the prize item and it drops on the ground
// (Takes effect after mvp_item_second_get_time elapses)
mvp_item_third_get_time: 2000

// Item drop rates (Note 2)

// The rate common items are dropped (ETC tab items, excluding cards).
// 2000 = 20× base rate.
item_rate_common: 10000
item_rate_common_boss: 10000
item_rate_common_mvp: 10000
item_drop_common_min: 1
item_drop_common_max: 10000

// The rate healing items are dropped (items that restore HP or SP).
// 2000 = 20× base rate.
item_rate_heal: 10000
item_rate_heal_boss: 10000
item_rate_heal_mvp: 10000
item_drop_heal_min: 1
item_drop_heal_max: 10000

// The rate at which usable items, other than healing items, are dropped.
// 2000 = 20× base rate.
item_rate_use: 10000
item_rate_use_boss: 10000
item_rate_use_mvp: 10000
item_drop_use_min: 1
item_drop_use_max: 10000

// The rate at which equipment is dropped.
// 2000 = 20× base rate.
item_rate_equip: 30000
item_rate_equip_boss: 30000
item_rate_equip_mvp: 30000
item_drop_equip_min: 1
item_drop_equip_max: 100000

// The rate at which cards are dropped.
// 50000 = 500× base rate.
// A standard 0.01% card becomes 5.00%.
item_rate_card: 50000
item_rate_card_boss: 50000
item_rate_card_mvp: 50000
item_drop_card_min: 1
item_drop_card_max: 10000

// The rate adjustment for MVP prize items placed directly into the MVP winner's inventory.
// 2000 = 20× base rate.
// Mode: 0 - official order, 1 - random order, 2 - all items.
item_rate_mvp: 2000
item_drop_mvp_min: 1
item_drop_mvp_max: 10000
item_drop_mvp_mode: 0

// The rate adjustment for equipment/card-granted item drops.
// 2000 = 20× base rate.
item_rate_adddrop: 2000
item_drop_add_min: 1
item_drop_add_max: 10000

// The rate adjustment for items inside equipment/card-granted item-group drops.
// Used by Ore Discovery, Gaia Sword, Jewel Sword, Blazzer Card, Tengu Card, and Dokkaebi Horn.
// 2000 = 20× base rate.
item_group_rate: 2000
item_group_drop_min: 1
item_group_drop_max: 10000

// Rate adjustment for Treasure Box drops. These override other modifiers.
// 2000 = 20× base rate.
item_rate_treasure: 2000
item_drop_treasure_min: 1
item_drop_treasure_max: 10000

// Use logarithmic drops? (Note 1)
// Keep this disabled so 2000 remains a true 20× rate and 50000 remains a true 500× rate.
item_logarithmic_drops: no

// Can a monster's drop rate become 0? (Note 1)
// Default: no, like official servers.
drop_rate0item: no

// Increase every item drop rate by 0.01%? (Note 1)
// Default: no.
drop_rateincrease: no

// Makes LUK affect drop rates on an absolute basis.
// 100 means each LUK adds 0.01% drop chance, regardless of base chance.
drops_by_luk: 0

// Makes LUK affect drop rates on a relative basis.
// 100 means each LUK adds 1% of the base drop chance.
drops_by_luk2: 0

// Whether Marine Spheres and Floras summoned by Alchemist drop items.
// 0: Nothing drops.
// 1: Only Marine Spheres drop items.
// 2: All Alchemist summons drop items.
alchemist_summon_reward: 1

// Announces rare item drops.
// 0 = no announcements.
// 1 = announce items with a 0.01% base chance.
// 333 = announce items with a 3.33% or lower base chance.
// 10000 = announce every item.
rare_drop_announce: 0

// Does autoloot take player bonuses and penalties into account? (Note 1)
autoloot_adjust: 0

// Does autoloot work when a monster is killed only by a mercenary?
mercenary_autoloot: no

// Disable mercenary item sharing when the master is idle.
// Use no, or the number of idle seconds required.
mer_idle_no_share: no

// How the server measures a mercenary master's idle time? (Note 3)
// 0x001 - Walk Request
// 0x002 - UseSkillToID Request
// 0x004 - UseSkillToPos Request
// 0x008 - UseItem Request
// 0x010 - Attack Request
// 0x020 - Chat Request
// 0x040 - Sit/Standup Request
// 0x080 - Emotion Request
// 0x100 - DropItem Request
// 0x200 - @/#Command Request
idletime_mer_option: 0x1F

// Maximum modified drop rate after bonuses are applied.
// 10000 = 100%. Leave this at 10000 so the 5% card rate is not capped.
drop_rate_cap: 100000
drop_rate_cap_vip: 100000

// Displays a colored pillar effect for dropped items with random options.
rndopt_drop_pillar: on

// Do drop-rate bonuses also increase map drops? (Note 1)
enable_bonus_map_drops: yes
